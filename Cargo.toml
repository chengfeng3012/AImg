[package]
name = "aimg"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust Android image toolchain for Windows (text-config driven permissions)"
license = "MIT"

[[bin]]
name = "aimg"
path = "src/main.rs"

[lib]
name = "aimg"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
byteorder = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
filetime = "0.2"
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "7"
xz2 = "0.1"
lzma-rs = "0.3"
bzip2 = "0.4"
ruzstd = "0.7"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
