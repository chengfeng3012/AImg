name: build-release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz, test: true }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, archive: tar.gz, test: false, apt: musl-tools }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   archive: zip,    test: true }
          - { os: ubuntu-latest,  target: i686-pc-windows-gnu,      archive: zip,    test: false, apt: gcc-mingw-w64-i686 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc,  archive: zip,    test: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Extra packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: mingw cross env
        if: matrix.target == 'i686-pc-windows-gnu'
        run: |
          {
            echo "CC_i686_pc_windows_gnu=i686-w64-mingw32-gcc"
            echo "AR_i686_pc_windows_gnu=i686-w64-mingw32-ar"
            echo "CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER=i686-w64-mingw32-gcc"
          } >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test
        if: matrix.test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          set -e
          name="aimg-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          cp "target/${{ matrix.target }}/release/aimg" "pkg/$name/aimg"
          cp README.md "pkg/$name/"
          if [ -d skills ]; then cp -r skills "pkg/$name/skills"; fi
          tar -C pkg -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip, linux)
        if: matrix.archive == 'zip' && runner.os != 'Windows'
        run: |
          set -e
          name="aimg-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          cp "target/${{ matrix.target }}/release/aimg.exe" "pkg/$name/aimg.exe"
          cp README.md "pkg/$name/"
          if [ -d skills ]; then cp -r skills "pkg/$name/skills"; fi
          ( cd pkg && zip -qr "../$name.zip" "$name" )
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"

      - name: Package (zip, windows)
        if: matrix.archive == 'zip' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "aimg-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "pkg/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aimg.exe" "pkg/$name/aimg.exe"
          Copy-Item README.md "pkg/$name/"
          if (Test-Path skills) { Copy-Item skills "pkg/$name/skills" -Recurse }
          Compress-Archive -Path "pkg/$name/*" -DestinationPath "$name.zip" -Force
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aimg-${{ matrix.target }}
          path: ${{ env.ASSET }}

  zig:
    name: zig ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -e
          name="aimg-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          cp "target/${{ matrix.target }}/release/aimg" "pkg/$name/aimg"
          cp README.md "pkg/$name/"
          if [ -d skills ]; then cp -r skills "pkg/$name/skills"; fi
          tar -C pkg -czf "$name.tar.gz" "$name"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aimg-${{ matrix.target }}
          path: aimg-${{ matrix.target }}.tar.gz

  cross:
    name: cross ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - arm-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -e
          name="aimg-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          cp "target/${{ matrix.target }}/release/aimg" "pkg/$name/aimg"
          cp README.md "pkg/$name/"
          if [ -d skills ]; then cp -r skills "pkg/$name/skills"; fi
          tar -C pkg -czf "$name.tar.gz" "$name"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aimg-${{ matrix.target }}
          path: aimg-${{ matrix.target }}.tar.gz

  android:
    name: android ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-linux-android,   cc: aarch64-linux-android21-clang,   ar: llvm-ar }
          - { target: armv7-linux-androideabi, cc: armv7a-linux-androideabi21-clang, ar: llvm-ar }
          - { target: x86_64-linux-android,    cc: x86_64-linux-android21-clang,    ar: llvm-ar }
          - { target: i686-linux-android,      cc: i686-linux-android21-clang,      ar: llvm-ar }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          tgt="${{ matrix.target }}"
          tgt_u=$(echo "$tgt" | tr '-' '_')
          cc="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}"
          ar="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ar }}"
          export "CC_${tgt_u}=$cc"
          export "CXX_${tgt_u}=$cc++"
          export "AR_${tgt_u}=$ar"
          export "CARGO_TARGET_$(echo "$tgt" | tr '[:lower:]-' '[:upper:]_')_LINKER=$cc"
          cargo build --release --locked --target "$tgt"

      - name: Package
        run: |
          set -e
          name="aimg-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          cp "target/${{ matrix.target }}/release/aimg" "pkg/$name/aimg"
          cp README.md "pkg/$name/"
          if [ -d skills ]; then cp -r skills "pkg/$name/skills"; fi
          tar -C pkg -czf "$name.tar.gz" "$name"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aimg-${{ matrix.target }}
          path: aimg-${{ matrix.target }}.tar.gz

  release:
    needs: [native, zig, cross, android]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: aimg v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
